name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, nvim ${{ matrix.neovim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        neovim: [stable, nightly]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Report the Neovim version under test
        run: nvim --version

      - name: Run the Lua suite
        run: nvim -l tests/run.lua

      - name: Record a session end to end
        run: nvim -l tests/e2e.lua tests/.out

      # The Lua suite stubs the writer, so this is the step that proves the bytes
      # on disk are valid gzip and that the edit stream replays to the document
      # the editor actually held.
      - name: Verify the recording is analysable
        run: python tests/verify_e2e.py tests/.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Check every Lua file parses
        run: nvim -l tests/lint.lua

      - name: Check formatting with StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests
